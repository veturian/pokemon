:root{
  --bg:#f4f1ea; --ink:#23262b; --muted:#5d636b; --line:#d9d3c5;
  --walk:#cfeccd; --walk-d:#b7dfb4;
  --surf:#8dbbea; --surf-d:#74a7dc;
  --dive:#86c9c6;
  --fish:#d3e6f8; --fish-d:#bad6f1;
  --rock:#e6d0b3; --rock-d:#d8bd9a; --dive-d:#6fb9b6;
  --head:#e1e3a8; --head-d:#cbcf86;
  --card:#fff; --hdr:rgba(244,241,234,.97); --ctl:#bdb6a4; --hover:#ece7da;
  --soft:rgba(0,0,0,.62); --hair:rgba(0,0,0,.08); --sep:rgba(0,0,0,.22); --edge:rgba(0,0,0,.10);
  --k-land:#355e3b; --k-water:#1f7ba6; --k-city:#f28c1e; --k-cave:#33363c;
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#15171b; --ink:#ebe9e4; --muted:#a6acb5; --line:#33373e;
  --walk:#27472e; --walk-d:#1f3a25;
  --surf:#2a5d92; --surf-d:#234f7e;
  --dive:#2a7a78; --dive-d:#226b69;
  --fish:#3a76a8; --fish-d:#2f6697;
  --rock:#5e4a33; --rock-d:#503e2a;
  --head:#4b5226; --head-d:#3f4520;
  --card:#1e2127; --hdr:rgba(21,23,27,.97); --ctl:#4a4f58; --hover:#2b2f37;
  --soft:rgba(255,255,255,.7); --hair:rgba(255,255,255,.10); --sep:rgba(255,255,255,.3); --edge:rgba(255,255,255,.12);
  --k-land:#3f7a49; --k-water:#2b8fbe; --k-city:#f59a2f; --k-cave:#5a5e66;
}
.k-land{--ac:var(--k-land)} .k-water{--ac:var(--k-water)} .k-city{--ac:var(--k-city)} .k-cave{--ac:var(--k-cave)}
.k-city .alabel{color:#2b1500}
*{box-sizing:border-box}
button,input,select{font-family:inherit}
html{scroll-padding-top:170px;font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.4 Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.bar{max-width:1280px;margin:0 auto}
h1{margin:0 0 8px;font-family:Bungee,"Arial Black",Impact,sans-serif;font-weight:400;font-size:1.9rem;line-height:1.1;letter-spacing:.5px;background:linear-gradient(90deg,#c0392b 0%,#d9822b 38%,#2f6db5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
h1 small{display:block;font-family:Calibri,Carlito,"Segoe UI",sans-serif;font-size:.85rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;-webkit-text-fill-color:var(--muted);color:var(--muted);margin-top:4px;filter:none}
.titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.credit{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.by{font-size:.9rem;color:var(--muted)}
.by b{color:var(--ink);font-weight:800;letter-spacing:.3px}
a.dl{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-weight:800;font-size:.9rem;letter-spacing:.2px;color:#fff;background:linear-gradient(135deg,#2e9e6b,#1e7a52);border:1px solid rgba(0,0,0,.3);border-radius:999px;padding:7px 15px;box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,box-shadow .12s,filter .12s}
a.dl:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25)}
a.dl:focus-visible{outline:3px solid #ffe066;outline-offset:2px}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.fs{display:flex;border:1px solid var(--ctl);border-radius:10px;overflow:hidden;background:var(--card)}
.fs button{border:0;background:var(--card);padding:7px 12px;font-weight:700;cursor:pointer;font-size:.95rem;color:var(--ink)}
.fs button+button{border-left:1px solid var(--line);font-size:1.1rem;padding:5px 12px}
.fs button:hover,.topbtn:hover,.tbtn:hover{background:var(--hover)}
.tbtn,.topbtn{border:1px solid var(--ctl);border-radius:10px;background:var(--card);padding:7px 12px;font-weight:700;cursor:pointer;color:var(--ink);font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#q{flex:1 1 260px;min-width:0;padding:9px 12px;border:1px solid var(--ctl);border-radius:10px;font-size:1rem;background:var(--card);font-family:inherit}
#jump{flex:0 1 230px;min-width:0;padding:9px 10px;border:1px solid var(--ctl);border-radius:10px;font-size:0.875rem;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid transparent;border-radius:999px;padding:6px 12px;font-size:0.8125rem;font-weight:600;cursor:pointer;color:var(--ink);opacity:.45;transition:.12s}
.chip.on{opacity:1;border-color:var(--ink)}
.chip[data-m=Walk]{background:var(--walk-d)} .chip[data-m=Surf]{background:var(--surf)}
.chip[data-m=Fish]{background:var(--fish-d)} .chip[data-m="Rock Smash"]{background:var(--rock-d)}
.chip[data-m=Dive]{background:var(--dive)} .chip[data-m=Headbutt]{background:var(--head-d)}
#count{font-size:0.7812rem;color:var(--muted);margin-left:auto}
.colhead{max-width:1280px;margin:8px auto 0;display:grid;grid-template-columns:10.6rem 6rem 1fr 1fr;gap:0;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.colhead div{padding:2px 12px}
main{max-width:1280px;margin:16px auto 60px;padding:0 16px}
.area{display:grid;grid-template-columns:10.6rem 1fr;margin:0 0 22px;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 16px rgba(60,50,30,.10);background:var(--card);border:1px solid var(--edge)}
.alabel{background:var(--ac);color:#fff;padding:14px 14px;font-weight:700;font-size:1.0rem;line-height:1.25;display:flex;flex-direction:column;gap:6px;border-right:4px solid rgba(0,0,0,.18)}
.alabel .num{font-size:0.6875rem;font-weight:600;opacity:.8;letter-spacing:1px}
.arows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:6rem 1fr 1fr;border-top:1px solid var(--hair)}
.row:first-child{border-top:0}
.row.subsep{border-top:3px solid var(--sep)}
.row>div{padding:10px 12px}
.meth{font-weight:700;font-size:0.8438rem;display:flex;flex-direction:column;gap:3px}
.meth small{font-weight:600;color:var(--soft);font-size:0.7188rem;line-height:1.2}
.meth .hm{font-weight:600;font-size:0.6875rem;color:var(--soft)}
.Walk{background:var(--walk)} .Walk .meth{background:var(--walk-d)}
.Surf{background:var(--surf)} .Surf .meth{background:var(--surf-d)}
.Dive{background:var(--dive)} .Dive .meth{background:var(--dive-d)}
.Fish{background:var(--fish)} .Fish .meth{background:var(--fish-d)}
.Rock{background:var(--rock)} .Rock .meth{background:var(--rock-d)}
.Headbutt{background:var(--head)} .Headbutt .meth{background:var(--head-d)}
.row>.meth{background:inherit}
.Walk>.meth{background:var(--walk-d)} .Surf>.meth{background:var(--surf-d)} .Dive>.meth{background:var(--dive-d)}
.Fish>.meth{background:var(--fish-d)} .Rock>.meth{background:var(--rock-d)} .Headbutt>.meth{background:var(--head-d)}
.same{grid-column:2 / span 2}
.lab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-block;font-weight:800;font-size:.72rem;letter-spacing:1.2px;text-transform:uppercase;padding:2px 10px;border-radius:5px;border:1px solid rgba(0,0,0,.3)}
.tag.d{background:linear-gradient(180deg,#ffe9a0,#ffc94a);color:#4a3200}
.tag.n{background:linear-gradient(180deg,#4b5aa8,#2b3470);color:#fff}
.sp{display:grid;grid-template-columns:1fr 2.75rem 3.4rem;gap:6px;align-items:baseline;padding:1px 0}
.sp .n{overflow-wrap:anywhere}
.sp .p{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.sp .l{font-size:0.75rem;color:var(--soft);text-align:right;white-space:nowrap}
.same .list{max-width:calc(50% - 8px)}
.tier{margin:0 0 8px}
.tier:last-child{margin:0}
.rod{display:inline-block;font-weight:800;font-size:.72rem;letter-spacing:1.2px;padding:2px 10px;border-radius:5px;margin:0 0 4px;border:1px solid rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.rod.o{background:linear-gradient(180deg,#e0a066,#b8733a);color:#2b1500}
.rod.g{background:linear-gradient(180deg,#f2f3f6,#b4b8c2);color:#1d2330}
.rod.s{background:linear-gradient(180deg,#ffe58a,#e6b422);color:#3a2a00}
mark{background:#ffe066;color:#000;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--muted);padding:60px 10px;font-size:1.0rem}
.hidden{display:none!important}
@media (max-width:820px){
  .colhead{display:none}
  .area{grid-template-columns:1fr}
  .alabel{flex-direction:row;justify-content:space-between;align-items:center;border-right:0;border-bottom:4px solid rgba(0,0,0,.18);padding:10px 14px}
  .row{grid-template-columns:1fr}
  .row>.meth{flex-direction:row;align-items:baseline;gap:10px;padding:8px 12px}
  .same{grid-column:auto}
  .same .list{max-width:none}
  header.top{padding:8px 12px 8px}
  .bar{display:block}
  h1{margin-bottom:4px}
  h1 small{display:none}
  .titlerow{gap:6px}
  .right{gap:6px}
  .by{display:none}
  .controls{gap:6px;margin-top:6px}
  #q{padding:7px 10px;flex:1 1 100%}
  #jump{flex:1 1 auto;min-width:0;max-width:60%}
  .chip{padding:4px 10px}
  .tbtn,.topbtn,.fs button{padding:5px 10px}
  a.dl{padding:5px 12px}
  h1{font-size:1.2rem}
  h1 small{font-size:.7rem;letter-spacing:1.4px}
  .right{align-items:flex-start;width:100%}
  .credit{justify-content:flex-start}
  .titlerow{flex-wrap:wrap}
  #count{margin-left:auto;width:auto}
}
</style>

const KIND={land:'Land route',water:'Sea route',city:'City / Town',cave:'Cave / Dungeon'};
const METHODS=['Walk','Surf','Fish','Rock Smash','Headbutt','Dive'];
const mcls=m=>m==='Rock Smash'?'Rock':m;
const rodCls={'OLD ROD':'o','GOOD ROD':'g','SUPER ROD':'s'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let activeM=new Set(METHODS);
const $=id=>document.getElementById(id);
// chips + jump
const present=new Set(DATA.flatMap(a=>a.rows.map(r=>r.m)));
METHODS.filter(m=>present.has(m)).forEach(m=>{const b=document.createElement('button');b.className='chip on';b.dataset.m=m;b.textContent=m;b.onclick=()=>{activeM.has(m)?activeM.delete(m):activeM.add(m);b.classList.toggle('on');render()};$('chips').appendChild(b)});
DATA.forEach((a,i)=>{const o=document.createElement('option');o.value=i;o.textContent=a.name;$('jump').appendChild(o)});
$('jump').onchange=e=>{if(e.target.value==='')return;$('q').value='';render();const el=document.getElementById('a'+e.target.value);if(el)el.scrollIntoView({behavior:'smooth'});e.target.value=''};
$('q').oninput=render;
function terms(){return $('q').value.toLowerCase().split(/\s+/).filter(Boolean)}
function hl(text,ts){let h=esc(text);if(!ts.length)return h;const lower=text.toLowerCase();const spans=[];ts.forEach(t=>{let i=0;while((i=lower.indexOf(t,i))>-1){spans.push([i,i+t.length]);i+=t.length}});if(!spans.length)return h;spans.sort((a,b)=>a[0]-b[0]);const m=[];spans.forEach(s=>{const l=m[m.length-1];if(l&&s[0]<=l[1])l[1]=Math.max(l[1],s[1]);else m.push(s.slice())});let o='',p=0;m.forEach(([s,e])=>{o+=esc(text.slice(p,s))+'<mark>'+esc(text.slice(s,e))+'</mark>';p=e});return o+esc(text.slice(p))}
function spHtml(s,ts){return `<div class="sp"><span class="n">${hl(s[0],ts)}</span><span class="p">${s[1]}%</span><span class="l">${s[2]}</span></div>`}
function cellHtml(c,ts){
  if(c&&c.fish)return c.fish.map(([k,list])=>`<div class="tier"><span class="rod ${rodCls[k]}">${k}</span>${list.map(s=>spHtml(s,ts)).join('')}</div>`).join('');
  return `<div class="list">${c.map(s=>spHtml(s,ts)).join('')}</div>`}
function speciesNames(c){return c==='same'?[]:c.fish?c.fish.flatMap(t=>t[1].map(s=>s[0])):c.map(s=>s[0])}
function rowText(a,r){return [a.name,r.sub,r.m,r.hm].concat(speciesNames(r.d),speciesNames(r.n)).join(' | ').toLowerCase()}
function render(){
  const ts=terms(),main=$('main');let shownRows=0,shownAreas=0,html='';
  DATA.forEach((a,i)=>{
    const vis=a.rows.filter(r=>activeM.has(r.m)&&ts.every(t=>rowText(a,r).includes(t)));
    if(!vis.length)return;
    shownAreas++;shownRows+=vis.length;
    let prev=null;
    const rows=vis.map(r=>{
      const sep=prev!==null&&prev!==r.sub;prev=r.sub;
      const hm=r.m==='Fish'?'':(r.hm&&r.hm!=='None'&&r.hm!==r.m?r.hm:'');
      const meth=`<div class="meth"><span>${r.m}</span>${r.sub?`<small>${hl(r.sub,ts)}</small>`:''}${r.m==='Surf'||r.m==='Rock Smash'||r.m==='Dive'||r.m==='Headbutt'?`<span class="hm">needs ${r.hm}</span>`:''}</div>`;
      let cells;
      if(r.n==='same')cells=`<div class="same"><div class="lab"><span class="tag d">☀️ Day</span><span class="tag n">🌙 Night</span></div>${cellHtml(r.d,ts)}</div>`;
      else cells=`<div><div class="lab"><span class="tag d">☀️ Day</span></div>${cellHtml(r.d,ts)}</div><div><div class="lab"><span class="tag n">🌙 Night</span></div>${cellHtml(r.n,ts)}</div>`;
      return `<div class="row ${mcls(r.m)}${sep?' subsep':''}">${meth}${cells}</div>`}).join('');
    html+=`<section class="area k-${a.kind}" id="a${i}"><div class="alabel"><span>${hl(a.name,ts)}</span><span class="num">${KIND[a.kind]}</span></div><div class="arows">${rows}</div></section>`;
  });
  main.innerHTML=html||'<div class="empty">No encounters match that search.</div>';
  $('count').textContent=`${shownAreas} area${shownAreas===1?'':'s'} · ${shownRows} row${shownRows===1?'':'s'}`;
}

const SIZES=[14,15.5,17,19,21,24];let si=2;
try{const v=parseInt(localStorage.getItem('fsIdx'));if(v>=0&&v<SIZES.length)si=v}catch(e){}
function applyFs(){document.documentElement.style.fontSize=SIZES[si]+'px';$('fsm').disabled=si===0;$('fsp').disabled=si===SIZES.length-1;try{localStorage.setItem('fsIdx',si)}catch(e){}}
$('fsm').onclick=()=>{if(si>0){si--;applyFs()}};
$('fsp').onclick=()=>{if(si<SIZES.length-1){si++;applyFs()}};
function padHdr(){document.documentElement.style.scrollPaddingTop=(document.querySelector('header.top').offsetHeight+8)+'px'}
window.addEventListener('resize',padHdr);window.addEventListener('load',padHdr);padHdr();
$('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
let theme;try{theme=localStorage.getItem('theme')}catch(e){}
if(theme!=='dark'&&theme!=='light')theme=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
function applyTheme(){document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'☀️ Light':'🌙 Dark';try{localStorage.setItem('theme',theme)}catch(e){}}
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme()};
applyTheme();
applyFs();
render();
</script>
